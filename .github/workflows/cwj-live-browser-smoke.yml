name: CareWithJohn live browser smoke
on:
  workflow_run:
    workflows: ["CareWithJohn live Pages verification"]
    types: [completed]
permissions:
  contents: read
jobs:
  browser-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the verified candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live browser checks
        run: node tests/cwj-browser-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carewithjohn-browser-smoke
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
